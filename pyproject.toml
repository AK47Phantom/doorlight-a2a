[project]
name = "doorlight-a2a"
version = "0.2.0"
description = "Doorlight local A2A transaction workflow demo"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[fastapi]>=1.0.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "google-genai>=1.0",
  "pillow>=11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8.0"]
